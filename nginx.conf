server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # No scripts run on this page: the JSON-LD block is data, not code.
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = / {
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=300" always;
    try_files /index.html =404;
  }

  # Fonts and the photo rarely change: browsers may keep them for a day.
  location ~ ^/(fonts/|anton\.webp$) {
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }
}
