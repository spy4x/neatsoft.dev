server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The only script is Umami's, served first-party from /umami/ (Traefik forwards it to the
  # Umami container), so 'self' covers both loading it and its reports. The JSON-LD block is
  # data, not code.
  set $csp "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
  add_header Content-Security-Policy $csp always;

  location = / {
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "public, max-age=300" always;
    try_files /index.html =404;
  }

  # Fonts and the photo rarely change: browsers may keep them for a day.
  location ~ ^/(fonts/|anton\.webp$) {
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }
}
